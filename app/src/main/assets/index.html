<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCU App</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --primary: #1e3a8a;
            --text: #e5e7eb;
            --muted: #cbd5e1;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg), #111827);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
            color: #ffffff;
            font-size: 2rem;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 999px;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">MCU APP</div>
        <h1>Welcome</h1>
        <p>This page is loaded from the Android app's local assets and is ready to be expanded with your own MCU logic, UI screens, or dashboard content.</p>
        <button onclick="alert('MCU app is running on Android!')">Tap to test</button>
    </div>
</body>
</html>
